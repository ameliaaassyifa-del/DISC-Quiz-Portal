openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DISC Theory Quiz API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: results
    description: Quiz result operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /results:
    get:
      operationId: listResults
      tags: [results]
      summary: List all quiz results
      responses:
        "200":
          description: List of results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizResult"
    post:
      operationId: submitResult
      tags: [results]
      summary: Submit a quiz result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizResultInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"

  /results/stats:
    get:
      operationId: getStats
      tags: [results]
      summary: Get aggregate DISC stats
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscStats"

  /results/{id}:
    get:
      operationId: getResult
      tags: [results]
      summary: Get a single quiz result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "404":
          description: Not found
    delete:
      operationId: deleteResult
      tags: [results]
      summary: Delete a quiz result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    QuizResult:
      type: object
      required:
        - id
        - name
        - dominance
        - influence
        - steadiness
        - conscientiousness
        - disc_type
        - created_at
      properties:
        id:
          type: integer
        name:
          type: string
        dominance:
          type: integer
        influence:
          type: integer
        steadiness:
          type: integer
        conscientiousness:
          type: integer
        disc_type:
          type: string
        created_at:
          type: string

    QuizResultInput:
      type: object
      required:
        - name
        - dominance
        - influence
        - steadiness
        - conscientiousness
        - disc_type
      properties:
        name:
          type: string
        dominance:
          type: integer
        influence:
          type: integer
        steadiness:
          type: integer
        conscientiousness:
          type: integer
        disc_type:
          type: string

    DiscStats:
      type: object
      required:
        - total
        - by_type
      properties:
        total:
          type: integer
        by_type:
          type: array
          items:
            $ref: "#/components/schemas/TypeCount"

    TypeCount:
      type: object
      required:
        - disc_type
        - count
      properties:
        disc_type:
          type: string
        count:
          type: integer
