kind = "web"
previewPath = "/"
title = "DISC Theory Quiz"
version = "1.0.0"
id = "artifacts/disc-quiz"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21102

[services.development]
run = "pnpm --filter @workspace/disc-quiz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/disc-quiz", "run", "build" ]
publicDir = "artifacts/disc-quiz/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21102"
BASE_PATH = "/"
